<script>
function num(n, one, two, few, many) { return n === 1 ? one : n === 2 ? two : n + " " + (n <= 10 ? few : many); }
window.APP = {
  repo: "amr-f-ramadan/eman-deutsch",
  key: "kk-eman-v2",
  newPerDay: 10,
  migrate: function (p) {
    var s = JSON.parse(localStorage.getItem("wohnen-cards-v1") || "null");
    if (!s || !Array.isArray(s.known)) return;
    var now = Date.now(), d = new Date(); d.setHours(0,0,0,0);
    s.known.forEach(function (id, i) { p.cards[id] = { b: 2, due: d.getTime() + (1 + i % 3) * 864e5, t: now, n: 1, w: 0 }; });
  },
  vapid: "BFZuIFPCB6Xfxe7Zh8ldo_6S9V4jIi8IskNE2ptXS6XJiHVb48SpkilWmXUOH3jwDjE9rIsFhXYL3_iy9jeiLz8",
  fields: ["w", "g", "hint", "ar", "ex", "tr", "note", "fam", "cat"],
  rules: {
    w: "w: das deutsche Wort in Grundform, bei Nomen OHNE Artikel. Ist die Eingabe Arabisch oder Englisch, nimm das gebräuchlichste passende deutsche Wort und erstelle die Karte dafür.",
    g: "g: \"der\", \"die\" oder \"das\" bei Nomen im Singular, \"pl\" bei Nomen nur im Plural, sonst \"x\".",
    intro: "Du erstellst eine Lernkarte für eine Ägypterin, die Deutsch lernt. Alles Arabische schreibst du im ägyptischen Dialekt, nicht auf Hocharabisch.",
    hint: 'hint: kurz, auf Deutsch: bei Nomen Artikel, Wort und Plural wie "die Fliese, -n", bei Verben drei Formen wie "räumt ein, räumte ein, hat eingeräumt", bei festen Präpositionen der Kasus, sonst die Wortart.',
    ar: 'ar: die Bedeutung auf Ägyptisch-Arabisch, kurz, zwei Varianten mit " / " getrennt, wenn sinnvoll.',
    ex: "ex: ein kurzer, natürlicher Beispielsatz aus dem Alltag; das Zielwort in <b>…</b>.",
    tr: "tr: die Übersetzung des Beispielsatzes auf Ägyptisch-Arabisch, natürlich formuliert, ohne <b>.",
    note: "note: nur wenn es eine typische Falle gibt (Verwechslung, Kasus, falscher Freund): kurz auf Ägyptisch-Arabisch, direkt an sie gerichtet (weibliche Formen). Sonst leer.",
    cat: 'cat: das Thema der Karte auf Ägyptisch-Arabisch, ein bis drei Wörter.\n  Schon vorhandene Themen: {topics}.\n  Nimm eines davon, wenn es inhaltlich passt. Nur wenn keines passt, erfinde ein neues, eher allgemeines Thema (z. B. "الشغل", "التسوق", "السفر").',
    fam: "fam: das Stammwort der Wortfamilie, klein geschrieben, meist der Infinitiv des Verbs, sonst das Grundwort (z. B. \"empfinden\" für empfindlich, Empfindung und empfinden).\n  Schon vorhandene Wortfamilien: {fams}.\n  Wenn das Wort wirklich zu einer davon gehört, nimm genau diesen Wert. Sonst ein neues Stammwort.\n  Wichtig: Wortfamilie heißt gleicher Wortstamm in der Form (abwesend und Abwesenheit), NICHT ähnliche Bedeutung (abwesend und verlassen sind keine Familie) und NICHT nur gleiche Vorsilbe.",
    end: "Keine Bindestriche als Gedankenstrich verwenden."
  },
  practice: {
    task: "Du bist Deutschlehrerin. Deine Schülerin ist Ägypterin und lernt Deutsch: Sie versteht viele Wörter, kann sie aber im Gespräch nicht spontan benutzen.\nErfinde eine kurze, konkrete Alltagssituation (Thema: {topic}), in der sie auf Deutsch etwas sagen muss und dabei diese Wörter natürlich benutzen kann: {words}.\n- task: die Situation und was sie sagen soll, auf Ägyptisch-Arabisch (nicht Hocharabisch), ein bis zwei Sätze, direkt an sie gerichtet (weibliche Formen). Nenne die Zielwörter nicht.\n- starter: ein möglicher Satzanfang auf Deutsch, drei bis sechs Wörter, ohne die Zielwörter.\nKeine Bindestriche als Gedankenstrich verwenden.",
    feedback: "Du bist eine freundliche Deutschlehrerin. Aufgabe: \"{task}\". Zielwörter: {words}. Antwort der Schülerin: \"{answer}\".\n- correct: true, wenn die Antwort grammatisch richtig ist und zur Aufgabe passt.\n- corrected: ihre Antwort mit so wenigen Änderungen wie möglich korrigiert, auf Deutsch.\n- natural: wie eine Muttersprachlerin es flüssig und einfach sagen würde, ein bis zwei Sätze auf Deutsch, mit den Zielwörtern.\n- tips: höchstens zwei sehr kurze Erklärungen der wichtigsten Fehler auf Ägyptisch-Arabisch, direkt an sie gerichtet (weibliche Formen); leer, wenn alles stimmt.\n- used: die Zielwörter, die sie richtig benutzt hat, genau wie in der Liste.\n- chunks: bis zu drei nützliche feste Wendungen auf Deutsch aus natural (drei bis sechs Wörter), die sie lernen sollte.\nKeine Bindestriche als Gedankenstrich verwenden."
