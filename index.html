<style>
:root{

}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161C22; --paper:#212A33; --ink:#E8EDF1; --muted:#9AA7B3; --line:#34404B;

  }
}
:root[data-theme="dark"]{
  --bg:#161C22; --paper:#212A33; --ink:#E8EDF1; --muted:#9AA7B3; --line:#34404B;
  --der:#7FAEE8; --die:#EE8A80; --das:#86C996; --other:#E0C06A; --ok:#86C996; --again:#EE8A80;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:var(--ar); font-size:16px; line-height:1.6}
.wrap{max-width:560px; margin:0 auto; padding:16px 16px 24px; display:flex; flex-direction:column; gap:14px; min-height:100%}
header h1{font-size:1.25rem; font-weight:600; margin:0}
header p{margin:2px 0 0; color:var(--muted); font-size:.9rem}
.bar{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.chip{font:inherit; font-size:.88rem; border:1px solid var(--line); background:var(--paper); color:var(--ink); padding:6px 12px; border-radius:999px; cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.progress{height:6px; background:var(--line); border-radius:3px; overflow:hidden}
.progress span{display:block; height:100%; background:var(--ok); width:0; transition:width .3s}
.count{font-size:.85rem; color:var(--muted); display:flex; justify-content:space-between}
.stage{perspective:1400px; flex:1; min-height:360px; display:flex}
.card{position:relative; width:100%; min-height:360px; cursor:pointer; transform-style:preserve-3d; transition:transform .45s ease; border:none; background:none; padding:0; font:inherit; color:inherit; text-align:inherit}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; background:var(--paper); border-radius:14px; border:1px solid var(--line); padding:22px 20px; display:flex; flex-direction:column; overflow-y:auto}
.face::before{content:""; position:absolute; top:0; right:0; left:0; height:6px; border-radius:14px 14px 0 0; background:var(--g,var(--other))}
.back{transform:rotateY(180deg)}
.front{justify-content:center; align-items:center; text-align:center; gap:10px}
.de{font-family:var(--de); direction:ltr; unicode-bidi:isolate}
.word{font-size:clamp(1.8rem,7vw,2.4rem); font-weight:600; line-height:1.25}
.art{color:var(--g,var(--other))}
.gram{font-family:var(--de); direction:ltr; color:var(--muted); font-size:.95rem}
.hint{color:var(--muted); font-size:.82rem; margin-top:14px}
.ar-big{font-size:clamp(1.6rem,6vw,2rem); font-weight:600; line-height:1.35}
.back h3{margin:0 0 4px; font-size:.8rem; font-weight:500; color:var(--muted)}
.back .mean{font-size:1.35rem; font-weight:600; margin-bottom:6px}
.back .deword{font-size:1.05rem; color:var(--muted); margin-bottom:14px; text-align:left}
.ex{border-top:1px solid var(--line); padding-top:12px; margin-top:4px}
.ex .de{font-size:1.1rem; text-align:left; display:block; margin-bottom:4px}
.ex .tr{color:var(--muted)}
.note{margin-top:14px; font-size:.9rem; background:color-mix(in srgb,var(--other) 12%,transparent); border-inline-start:3px solid var(--other); padding:8px 10px; border-radius:6px}
.legend{display:flex; gap:14px; font-size:.8rem; color:var(--muted); justify-content:center; direction:ltr; font-family:var(--de)}
.legend b{font-weight:600}
.speak{display:flex; gap:8px; align-items:center}
.speak .btn{flex:1; padding:10px}
.tts-msg{font-size:.85rem; color:var(--again); text-align:center}
.rate{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.btn{font:inherit; font-weight:500; border-radius:10px; padding:12px; cursor:pointer; border:1px solid var(--line); background:var(--paper); color:var(--ink)}
.btn.again{border-color:var(--again); color:var(--again)}
.btn.ok{background:var(--ok); border-color:var(--ok); color:var(--paper)}
.nav{display:flex; justify-content:space-between; gap:10px}
.nav .btn{flex:1}
button:focus-visible{outline:3px solid var(--der); outline-offset:2px}
.empty{margin:auto; text-align:center; color:var(--muted); padding:40px 10px}
@media (prefers-reduced-motion:reduce){.card{transition:none}.progress span{transition:none}}
</style>

 {id:"langfristig", g:"x", w:"langfristig", gr:"Adjektiv / Adverb", ar:"على المدى الطويل", ex:"Wir suchen langfristig eine größere Wohnung.", tr:"على المدى الطويل بندور على شقة أكبر."},
 {id:"kurzfristig", g:"x", w:"kurzfristig", gr:"Adjektiv / Adverb", ar:"لفترة قصيرة / على آخر لحظة", ex:"Ich muss den Termin leider kurzfristig absagen.", tr:"للأسف لازم ألغي الميعاد على آخر لحظة."},
 {id:"soviel", g:"x", w:"so viel", gr:"≠ zu viel", ar:"كتير كده / بالشكل ده", ex:"Warum kostet die Wohnung so viel?", tr:"ليه الشقة غالية كده؟", note:"«so viel» = كتير كده (so much). لو عايزة «كتير جداً» يبقى «sehr viel»."},
 {id:"zuviel", g:"x", w:"zu viel", gr:"≠ zu wenig", ar:"كتير زيادة عن اللزوم", ex:"Wir zahlen zu viel Miete.", tr:"إحنا بندفع إيجار كتير زيادة."},
 {id:"blick", g:"der", w:"Blick", gr:"der Blick, -e", ar:"نظرة / منظر", ex:"Aus der Küche hat man einen Blick auf den Park.", tr:"من المطبخ تقدري تشوفي الجنينة."},
 {id:"ausblick", g:"der", w:"Ausblick", gr:"der Ausblick, -e", ar:"منظر (من مكان عالي أو من الشباك)", ex:"Vom Balkon haben wir einen tollen Ausblick auf die Berge.", tr:"من البلكونة عندنا منظر تحفة على الجبال."},
 {id:"einblick", g:"der", w:"Einblick", gr:"der Einblick, -e", ar:"فكرة من جوه / نظرة عن قرب", ex:"Die Besichtigung gibt einen guten Einblick in die Wohnung.", tr:"المعاينة بتديكي فكرة كويسة عن الشقة من جوه."},
 {id:"einraeumen", g:"x", w:"einräumen", gr:"räumt ein, räumte ein, hat eingeräumt", ar:"يحط الحاجة في مكانها (دولاب/أوضة)", ex:"Ich räume das Geschirr in den Schrank ein.", tr:"بحط المواعين في الدولاب."},
 {id:"ausraeumen", g:"x", w:"ausräumen", gr:"räumt aus, räumte aus, hat ausgeräumt", ar:"يفضّي", ex:"Vor dem Umzug müssen wir die Schränke ausräumen.", tr:"قبل النقل لازم نفضي الدواليب."},
 {id:"umraeumen", g:"x", w:"umräumen", gr:"räumt um, räumte um, hat umgeräumt", ar:"يغيّر ترتيب الأوضة", ex:"Am Wochenende haben wir das Wohnzimmer umgeräumt.", tr:"في الويك إند غيرنا ترتيب أوضة المعيشة."},
 {id:"aufraeumen", g:"x", w:"aufräumen", gr:"räumt auf, räumte auf, hat aufgeräumt", ar:"يروّق / يرتّب", ex:"Räum bitte dein Zimmer auf!", tr:"روّق أوضتك لو سمحت!"},
 {id:"geraeumig", g:"x", w:"geräumig", gr:"Adjektiv (≠ eng)", ar:"واسع", ex:"Die Wohnung ist hell und geräumig.", tr:"الشقة منورة وواسعة."},
 {id:"streichen", g:"x", w:"streichen", gr:"streicht, strich, hat gestrichen", ar:"يدهن (حيطة / بيت)", ex:"Wir haben die Wände weiß gestrichen.", tr:"دهنّا الحيطان أبيض."},
 {id:"aber", g:"x", w:"aber", gr:"Konnektor (Position 0)", ar:"لكن / بس", ex:"Die Wohnung ist klein, aber sehr gemütlich.", tr:"الشقة صغيرة بس مريحة جداً.", note:"«aber» مش بياخد مكان في الجملة (Position 0)، فالفعل بيفضل في المكان التاني بعده: «aber ich komme später»."}
];

const ART = {der:"der ", die:"die ", das:"das ", pl:"die ", x:""};
const COL = {der:"var(--der)", die:"var(--die)", das:"var(--das)", pl:"var(--die)", x:"var(--other)"};
const KEY = "wohnen-cards-v1";

let known = new Set(), order = CARDS.map((_,i)=>i), onlyLearn=false, arFirst=false, idx=0;
try{ const s = JSON.parse(localStorage.getItem(KEY)||"null"); if(s && Array.isArray(s.known)) known = new Set(s.known); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({known:[...known]})); }catch(e){} }

const $ = id => document.getElementById(id);
function deck(){ return order.filter(i => !onlyLearn || !known.has(CARDS[i].id)); }
function esc(t){ return String(t).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function germanHTML(c){
  const a = ART[c.g];
  return `<span class="de word">${a?`<span class="art">${a}</span>`:""}${esc(c.w)}</span>`;
}
function render(){
  const d = deck();
  $("known").textContent = `حافظة ${known.size} من ${CARDS.length}`;
  $("prog").style.width = (known.size/CARDS.length*100)+"%";
  const stage = $("stage");
  if(!d.length){
    stage.innerHTML = `<div class="empty">كده خلصتي كل الكلمات اللي كانت لسه.<br>دوسي «كل الكلمات» عشان تراجعي تاني.</div>`;
    $("pos").textContent = ""; return;
  }
  if(idx >= d.length) idx = 0;
  if(idx < 0) idx = d.length-1;
  const c = CARDS[d[idx]];
  $("pos").textContent = `كارت ${idx+1} من ${d.length}`;
  const front = arFirst
    ? `<div class="ar-big">${esc(c.ar)}</div><div class="hint">الكلمة بالألماني إيه؟ دوسي عشان تشوفي</div>`
    : `${germanHTML(c)}<div class="gram">${esc(c.gr)}</div><div class="hint">دوسي عشان تشوفي المعنى</div>`;
  const back = `
    <h3>المعنى</h3>
    <div class="mean">${esc(c.ar)}</div>
    <div class="deword">${germanHTML(c).replace('word','')} <span class="gram">(${esc(c.gr)})</span></div>
    <div class="ex"><h3>مثال</h3><span class="de">${esc(c.ex)}</span><div class="tr">${esc(c.tr)}</div></div>
    ${c.note?`<div class="note">ملاحظة: ${esc(c.note)}</div>`:""}`;
  stage.innerHTML = `<button class="card" id="card" style="--g:${COL[c.g]}" aria-label="اقلبي الكارت">
      <div class="face front">${front}</div>
      <div class="face back">${back}</div></button>`;
  $("card").addEventListener("click", e => e.currentTarget.classList.toggle("flipped"));
}
function mark(isKnown){
  const d = deck(); if(!d.length) return;
  const id = CARDS[d[idx]].id;
  if(isKnown) known.add(id); else known.delete(id);
  save();
  if(!(onlyLearn && isKnown)) idx++;
  render();
}
$("ok").onclick = ()=>mark(true);
$("again").onclick = ()=>mark(false);
$("next").onclick = ()=>{ idx++; render(); };
$("prev").onclick = ()=>{ idx--; render(); };
$("shuf").onclick = ()=>{ for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];} idx=0; render(); };
$("fAll").onclick = ()=>{ onlyLearn=false; $("fAll").setAttribute("aria-pressed","true"); $("fLearn").setAttribute("aria-pressed","false"); idx=0; render(); };
$("fLearn").onclick = ()=>{ onlyLearn=true; $("fLearn").setAttribute("aria-pressed","true"); $("fAll").setAttribute("aria-pressed","false"); idx=0; render(); };
$("dir").onclick = ()=>{ arFirst=!arFirst; $("dir").setAttribute("aria-pressed", String(arFirst)); render(); };
$("reset").onclick = ()=>{ if(confirm("تمسحي كل اللي حفظتيه وتبدئي من الأول؟")){ known.clear(); save(); order=CARDS.map((_,i)=>i); idx=0; render(); } };
// Pronunciation (browser text-to-speech, German voice)
let slow = false, deVoice = null;
const hasTTS = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
function pickVoice(){
  if(!hasTTS) return;
  const vs = speechSynthesis.getVoices();
  deVoice = vs.find(v=>v.lang==="de-DE") || vs.find(v=>v.lang && v.lang.toLowerCase().startsWith("de")) || null;
}
if(hasTTS){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function currentCard(){ const d = deck(); return d.length ? CARDS[d[idx]] : null; }
function say(text){
  if(!hasTTS){ $("ttsMsg").hidden = false; return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "de-DE"; if(deVoice) u.voice = deVoice;
  u.rate = slow ? 0.7 : 0.95;
  speechSynthesis.speak(u);
}
$("sayWord").onclick = ()=>{ const c = currentCard(); if(c) say((ART[c.g]||"") + c.w); };
$("saySent").onclick = ()=>{ const c = currentCard(); if(c) say(c.ex); };
$("slow").onclick = ()=>{ slow = !slow; $("slow").setAttribute("aria-pressed", String(slow)); };

document.addEventListener("keydown", e=>{
  if(e.key==="ArrowLeft"){ idx++; render(); }
  else if(e.key==="ArrowRight"){ idx--; render(); }
  else if(e.key===" "){ e.preventDefault(); const c=$("card"); if(c) c.classList.toggle("flipped"); }
});
render();
</script>
</body>
</html>
