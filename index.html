<body>
<div class="wrap">
  <header><h1>كلمات ألماني</h1></header>
  <main id="main"></main>
</div>
<div id="toast" hidden role="status"></div>
<nav>
  <button data-mode="learn">مذاكرة<span id="badge" hidden></span></button>
  <button data-mode="quiz">der/die/das</button>
  <button data-mode="list">كل الكلمات</button>
  <button data-mode="settings">الإعدادات</button>
</nav>
<script>
window.APP = {
  repo: "amr-f-ramadan/eman-deutsch",
  key: "kk-eman-v2",
  newPerDay: 10,
  migrate: function (p) {
    var s = JSON.parse(localStorage.getItem("wohnen-cards-v1") || "null");
    if (!s || !Array.isArray(s.known)) return;
    var now = Date.now(), d = new Date(); d.setHours(0,0,0,0);
    s.known.forEach(function (id, i) { p.cards[id] = { b: 2, due: d.getTime() + (1 + i % 3) * 864e5, t: now, n: 1, w: 0 }; });
  },
  t: {
    flip: "اقلبي الكارت", show: "اعرفي المعنى", again: "لسه", good: "عرفتها",
    sayWord: "اسمعي الكلمة", sayEx: "اسمعي المثال", whatDe: "الكلمة دي بالألماني إيه؟",
    left: "فاضل {n} كروت", newCard: "جديدة", todayStat: "النهارده: {d} مراجعة و{f} كلمات جديدة",
    doneTitle: "خلصتي مذاكرة النهارده", doneText: "بكرة هيبقى عندك {n} كروت للمراجعة.", moreNew: "عايزة كلمات جديدة كمان",
    artQ: "الأداة الصح إيه؟", next: "الكلمة اللي بعدها", artStat: "في الكلمة دي: {ok} صح و{w} غلط", noNouns: "مفيش أسماء في القايمة.",
    listStat: "{a} من {t} كلمة ثابتين معاكي", level: "المستوى",
    syncH: "مزامنة التقدم", syncHelp: "لو حطيتي GitHub token، التقدم بتاعك هيتحفظ في الـ repo ويبقى هو هو على كل الأجهزة.",
    tokenLabel: "GitHub token (Fine-grained، للـ repo ده بس، Contents: Read and write)", saveToken: "احفظي الـ token", tokenOk: "اتوصلت، والتقدم اتزامن",
    syncNow: "زامني دلوقتي", delToken: "امسحي الـ token",
    st_local: "محفوظ على الجهاز ده بس", st_syncing: "بيزامن…", st_ok: "متزامن", st_error: "المزامنة فشلت، جربي تاني بعدين", st_badtoken: "الـ token غلط أو خلص",
    backupH: "نسخة احتياطية", export: "احفظي نسخة كملف", import: "رجّعي نسخة من ملف", imported: "النسخة اترجعت", importFail: "الملف ده مش مناسب",
    optsH: "المذاكرة", newPerDay: "كلمات جديدة في اليوم", arFirst: "اعرضي العربي الأول", slow: "نطق أبطأ",
    resetH: "البداية من الأول", reset: "امسحي التقدم كله", resetQ: "متأكدة إنك عايزة تمسحي التقدم كله؟"
  }
};
